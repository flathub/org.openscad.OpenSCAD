app-id: org.openscad.OpenSCAD
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: openscad-nightly
rename-icon: openscad-nightly
rename-mime-file: openscad-nightly.xml
rename-mime-icons:
  - openscad-nightly
rename-desktop-file: openscad-nightly.desktop
rename-appdata-file: org.openscad.OpenSCAD-nightly.appdata.xml
copy-icon: true
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --device=dri
  - --filesystem=home
  - --filesystem=/run/spnav.sock:ro
  - --env=SPNAV_SOCKET=/run/spnav.sock
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - "*.a"
modules:
  - name: glm
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR:PATH=/app/lib
      - -DGLM_BUILD_TESTS=OFF
      - -DBUILD_SHARED_LIBS=OFF
    sources:
      - type: archive
        url: https://github.com/g-truc/glm/archive/refs/tags/1.0.3.tar.gz
        sha256: 6775e47231a446fd086d660ecc18bcd076531cfedd912fbd66e576b118607001
  - name: polyclipping2
    buildsystem: cmake-ninja
    builddir: true
    subdir: CPP
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR:PATH=/app/lib
      - -DCLIPPER2_UTILS=OFF
      - -DCLIPPER2_EXAMPLES=OFF
      - -DCLIPPER2_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/AngusJohnson/Clipper2/archive/refs/tags/Clipper2_2.0.1.tar.gz
        sha256: 2a3693aceab4aed3e39b743e038d87701acc53cf05ed7b2013aab3e0aec5287e
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --with-libraries=filesystem,program_options,regex,thread
      - ./b2 -j $FLATPAK_BUILDER_N_JOBS install --prefix=/app
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.bz2
        sha256: de5e6b0e4913395c6bdfa90537febd9028ea4c0735d2cdb0cd9b45d5f51264f5
  - shared-modules/glew/glew.json
  - shared-modules/glu/glu-9.json
  - name: freeglut
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR:PATH=/app/lib
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    build-options:
      cflags: -fcommon
      cxxflags: -fcommon
    sources:
      - type: archive
        url: https://github.com/freeglut/freeglut/releases/download/v3.8.0/freeglut-3.8.0.tar.gz
        sha256: 674dcaff25010e09e450aec458b8870d9e98c46f99538db457ab659b321d9989
  - name: libXmu
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/lib/libXmu-1.3.1.tar.xz
        sha256: 81a99e94c4501e81c427cbaa4a11748b584933e94b7a156830c3621256857bc4
  - name: eigen
    builddir: true
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    cleanup:
      - /share
    sources:
      - type: archive
        url: https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.bz2
        sha256: e4de6b08f33fd8b8985d2f204381408c660bffa6170ac65b68ae1bd3cd575c0a
  - name: mpfr
    sources:
      - type: archive
        url: https://www.mpfr.org/mpfr-current/mpfr-4.2.2.tar.xz
        sha256: b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01
  - name: cgal
    cleanup:
      - /bin
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: archive
        url: https://github.com/CGAL/cgal/releases/download/v6.2/CGAL-6.2-library.tar.xz
        sha256: f75d2b2486842fb47222c780c7241c262d392802d0811143c4e9b539972ee55b
  - name: qscintilla
    buildsystem: qmake
    subdir: src
    sources:
      - type: archive
        url: https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz
        sha256: dfe13c6acc9d85dfcba76ccc8061e71a223957a6c02f3c343b30a9d43a4cdd4d
      - type: patch
        path: patches/qscintilla-lib-paths.patch
  - name: double-conversion
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR:PATH=/app/lib
    sources:
      - type: archive
        url: https://github.com/google/double-conversion/archive/refs/tags/v3.4.0.tar.gz
        sha256: 42fd4d980ea86426e457b24bdfa835a6f5ad9517ddb01cdb42b99ab9c8dd5dc9
  - name: tbb
    buildsystem: cmake-ninja
    config-opts:
      - -DTBB_TEST=OFF
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR:PATH=/app/lib
    sources:
      - type: archive
        url: https://github.com/uxlfoundation/oneTBB/archive/refs/tags/v2023.0.0.tar.gz
        sha256: f8767b971ec6aea25dde58ae0f593e94e7aa75a739a86f67967012f69e2199b1
  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR:PATH=/app/lib
      - -DCMAKE_INSTALL_INCLUDEDIR:PATH=/app/include
    sources:
      - type: archive
        url: https://libzip.org/download/libzip-1.11.4.tar.xz
        sha256: 8a247f57d1e3e6f6d11413b12a6f28a9d388de110adc0ec608d893180ed7097b
  - name: lib3mf
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR:PATH=/app/lib
      - -DLIB3MF_TESTS=OFF
      - -DUSE_INCLUDED_ZLIB=OFF
      - -DUSE_INCLUDED_LIBZIP=OFF
    sources:
      - type: archive
        strip-components: 0
        url: https://github.com/3MFConsortium/lib3mf/releases/download/v2.5.0/lib3mf-2.5.0-source-with-submodules.zip
        sha256: 46914f7c7a82ee0839fdd09b339daf621540d5c8d8904b2a0449fd67353dd7cb
  - name: libspnav
    sources:
      - type: archive
        url: https://github.com/FreeSpacenav/libspnav/releases/download/v1.2/libspnav-1.2.tar.gz
        sha256: 093747e7e03b232e08ff77f1ad7f48552c06ac5236316a5012db4269951c39db
  - name: graphite2
    # Included for fixing https://github.com/harfbuzz/harfbuzz/issues/5439
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR:PATH=/app/lib
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/silnrsi/graphite/releases/download/1.3.15/graphite2-1.3.15.tgz
        sha256: c6bc8b4252724665297f7cad0c55897285c673f9b8e6db3522ace833593fe0b1
  - name: harfbuzz
    # Included for fixing https://github.com/harfbuzz/harfbuzz/issues/5439
    buildsystem: meson
    config-opts:
      - -Dcpp_args=-fno-exceptions
      - -Dgraphite2=enabled
      - -Dgobject=disabled
      - -Dutilities=disabled
      - -Dtests=disabled
      - -Dbenchmark=disabled
      - -Ddocs=disabled
    sources:
      - type: archive
        url: https://github.com/harfbuzz/harfbuzz/releases/download/14.2.1/harfbuzz-14.2.1.tar.xz
        sha256: a54a5d8e9380a41fbb762ce367bcbf7704792dfca0d93f1bbca86c5a57902e0e
  - name: openscad
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DUSE_BUILTIN_OPENCSG=ON
      - -DMANIFOLD_PYBIND=OFF
      - -DMANIFOLD_TEST=OFF
      - -DENABLE_PYTHON=ON
      - -DENABLE_TESTS=OFF
      - -DEXPERIMENTAL=ON
      - -DSUFFIX=nightly
      - -DSNAPSHOT=ON
      - -DUSE_QT6=ON
      - -DOPENSCAD_VERSION=2026.07.01.fp
      - -DOPENSCAD_COMMIT=34a81df5b
    cleanup:
      - /share/pixmaps
    sources:
      - type: git
        url: https://github.com/openscad/openscad.git
        commit: 34a81df5bb1fc95b8eb5b59d91a7831413264e30
    post-install:
      - sed -i -e 's/\(<id>org.openscad.OpenSCAD\)-nightly/\1/' /app/share/metainfo/org.openscad.OpenSCAD-nightly.appdata.xml
